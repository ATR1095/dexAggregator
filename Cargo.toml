[package]
name = "SOR"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.32", features = ["full"] }
tokio-stream = "0.1"
dashmap = { version = "5.5", features = ["serde"] }
log = "0.4"
env_logger = "0.10"
petgraph = "0.6"
spl-math = "0.1"
fixed = "1.23.1"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"

[build-dependencies]
tonic-build = "0.10"
