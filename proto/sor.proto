syntax = "proto3";

package sor;

option go_package = "github.com/dexAggregator/APIGateway/proto/sor";

service SORService {
  rpc Quote (QuoteRequest) returns (QuoteResponse);
  rpc Swap (SwapRequest) returns (SwapResponse);
  rpc ListTokens (ListTokensRequest) returns (ListTokensResponse);
}

message ListTokensRequest {}

message TokenInfo {
  string mint = 1;
  string symbol = 2;
  uint32 decimals = 3;
}

message ListTokensResponse {
  repeated TokenInfo token_a = 1;  // All tokens appearing as token_a in pools
  repeated TokenInfo token_b = 2;  // All tokens appearing as token_b in pools
}

message QuoteRequest {
  string input_token = 1;
  string output_token = 2;
  string amount = 3;
}

message QuoteResponse {
  string input_token = 1;
  string output_token = 2;
  string input_amount = 3;
  string output_amount = 4;
  repeated string path = 5; // Pool IDs
  double price_impact = 6;
  repeated string token_path = 7; // e.g., ["SOL", "USDC", "USDT"]
  string human_input_amount = 8;
  string human_output_amount = 9;
}

message SwapRequest {
  string input_token = 1;
  string output_token = 2;
  string amount = 3;
  string user_address = 4;
  double slippage_bps = 5;
}

// A single candidate route with its token path and amounts.
message DetailedRoute {
  repeated string token_path = 1;  // e.g., ["SOL", "USDC"]
  repeated string pool_ids = 2;    // Pool IDs used
  string amount_in = 3;
  string amount_out = 4;
  string human_amount_in = 5;
  string human_amount_out = 6;
  double price_impact = 7;
  repeated string dex_labels = 8;
}

message SwapResponse {
  string tx_hash = 1;
  string status = 2;
  string message = 3;
  repeated string route = 4;          // Best route token path (kept for backwards compat)
  string output_amount = 5;
  string human_output_amount = 6;
  repeated DetailedRoute routes = 7;  // All routes, sorted best (highest output) first
}
