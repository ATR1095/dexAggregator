basePath: /
definitions:
  handlers.QuoteRequest:
    properties:
      amount:
        type: string
      inputToken:
        type: string
      outputToken:
        type: string
    required:
    - amount
    - inputToken
    - outputToken
    type: object
  handlers.SwapRequest:
    properties:
      amount:
        type: string
      inputToken:
        type: string
      outputToken:
        type: string
      slippageBps:
        description: 0 to 10%
        maximum: 1000
        minimum: 0
        type: number
      userAddress:
        type: string
    required:
    - amount
    - inputToken
    - outputToken
    - userAddress
    type: object
  sor.QuoteResponse:
    properties:
      input_amount:
        type: string
      input_token:
        type: string
      output_amount:
        type: string
      output_token:
        type: string
      path:
        items:
          type: string
        type: array
      price_impact:
        type: number
    type: object
  sor.DetailedRoute:
    description: A single candidate route with token path and amounts.
    properties:
      token_path:
        description: Human-readable token symbols in order (e.g. SOL -> USDC)
        items:
          type: string
        type: array
      pool_ids:
        description: Pool IDs used along this route
        items:
          type: string
        type: array
      amount_in:
        description: Atomic input amount allocated to this route
        type: string
      amount_out:
        description: Atomic output amount from this route
        type: string
      human_amount_in:
        description: Human-readable input amount
        type: string
      human_amount_out:
        description: Human-readable output amount
        type: string
    type: object
  sor.SwapResponse:
    properties:
      tx_hash:
        type: string
      status:
        type: string
      message:
        type: string
      route:
        description: Best route token path (backwards compatible)
        items:
          type: string
        type: array
      output_amount:
        description: Total atomic output amount
        type: string
      human_output_amount:
        description: Total human-readable output amount
        type: string
      routes:
        description: All candidate routes sorted best-first (highest output_amount first)
        items:
          $ref: '#/definitions/sor.DetailedRoute'
        type: array
    type: object
  sor.TokenInfo:
    description: Information about a token in a liquidity pool.
    properties:
      mint:
        description: Token mint address
        type: string
      symbol:
        description: Token symbol (e.g. SOL, USDC)
        type: string
      decimals:
        description: Token decimal places
        type: integer
    type: object
  sor.ListTokensResponse:
    properties:
      token_a:
        description: All tokens appearing as token_a in pools
        items:
          $ref: '#/definitions/sor.TokenInfo'
        type: array
      token_b:
        description: All tokens appearing as token_b in pools
        items:
          $ref: '#/definitions/sor.TokenInfo'
        type: array
    type: object
host: localhost:8081
info:
  contact: {}
  description: API Gateway for the Solana DEX Aggregator.
  title: DEX Aggregator API Gateway
  version: "1.0"
paths:
  /v1/quote:
    post:
      consumes:
      - application/json
      description: Find the best route and output amount for a swap
      parameters:
      - description: Quote Request
        in: body
        name: quote
        required: true
        schema:
          $ref: '#/definitions/handlers.QuoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sor.QuoteResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a token swap quote
      tags:
      - swap
  /v1/swap:
    post:
      consumes:
      - application/json
      description: Initiate a swap transaction via the SOR
      parameters:
      - description: Swap Request
        in: body
        name: swap
        required: true
        schema:
          $ref: '#/definitions/handlers.SwapRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sor.SwapResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute a token swap
      tags:
      - swap
  /v1/tokens:
    get:
      description: Returns all known tokens grouped by their position (token_a and token_b) across liquidity pools
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sor.ListTokensResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List all tokens
      tags:
      - tokens
swagger: "2.0"
